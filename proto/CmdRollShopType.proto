syntax = "proto3";


import "Common.proto";

enum CmdRollShopType {
	CmdRollShopType_NLCDGIPGFDJ = 0;
	CmdRollShopType_TakeRollShopRewardScRsp = 6913;
	CmdRollShopType_DoGachaInRollShopCsReq = 6917;
	CmdRollShopType_GetRollShopInfoCsReq = 6910;
	CmdRollShopType_GetRollShopInfoScRsp = 6916;
	CmdRollShopType_TakeRollShopRewardCsReq = 6904;
	CmdRollShopType_DoGachaInRollShopScRsp = 6908;
}

message DoGachaInRollShopCsReq {
	uint32 gacha_random = 6; // offset: 24
	uint32 roll_shop_id = 13; // offset: 32
	uint32 gacha_count = 14; // offset: 28
}

message DoGachaInRollShopScRsp {
	uint32 LDBCKJIPDHF = 2; // offset: 44
	uint32 reward_display_type = 3; // offset: 40
	uint32 retcode = 4; // offset: 36
	uint32 roll_shop_id = 5; // offset: 32
	ItemList reward = 9; // offset: 24
}

message GetRollShopInfoCsReq {
	uint32 roll_shop_id = 5; // offset: 24
}

message GetRollShopInfoScRsp {
	uint32 gacha_random = 6; // offset: 36
	repeated uint32 shop_group_id_list = 10; // offset: 24
	uint32 roll_shop_id = 11; // offset: 32
	uint32 retcode = 14; // offset: 40
}

message TakeRollShopRewardCsReq {
	uint32 FGFLIEADBLH = 2; // offset: 24
}

message TakeRollShopRewardScRsp {
	uint32 group_type = 3; // offset: 32
	ItemList reward = 4; // offset: 16
	uint32 roll_shop_id = 6; // offset: 36
	uint32 retcode = 13; // offset: 40
}

syntax = "proto3";


import "Common.proto";

enum CmdSummonActivityType {
	CmdSummonActivityType_NLCDGIPGFDJ = 0;
	CmdSummonActivityType_EnterSummonActivityStageScRsp = 7569;
	CmdSummonActivityType_GetSummonActivityDataCsReq = 7562;
	CmdSummonActivityType_EnterSummonActivityStageCsReq = 7570;
	CmdSummonActivityType_GetSummonActivityDataScRsp = 7563;
	CmdSummonActivityType_SummonActivityBattleEndScNotify = 7564;
}

message EnterSummonActivityStageCsReq {
	uint32 DBKHHCGGKNN = 4; // offset: 44
	repeated OOAJJMEGIFO avatar_list = 9; // offset: 16

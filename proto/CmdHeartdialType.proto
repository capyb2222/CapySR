enum CmdHeartdialType {
	CmdHeartdialType_NLCDGIPGFDJ = 0;
	CmdHeartdialType_GetHeartDialInfoScRsp = 6325;
	CmdHeartdialType_HeartDialTraceScriptCsReq = 6315;
	CmdHeartdialType_FinishEmotionDialoguePerformanceCsReq = 6358;
	CmdHeartdialType_SubmitEmotionItemScRsp = 6316;
	CmdHeartdialType_ChangeScriptEmotionScRsp = 6375;
	CmdHeartdialType_GetHeartDialInfoCsReq = 6334;
	CmdHeartdialType_ChangeScriptEmotionCsReq = 6305;
	CmdHeartdialType_SubmitEmotionItemCsReq = 6360;
	CmdHeartdialType_HeartDialScriptChangeScNotify = 6383;
	CmdHeartdialType_HeartDialTraceScriptScRsp = 6342;

syntax = "proto3";


import "Common.proto";

message ActiveActivityData {
	uint32 CDMIKICANEP = 3; // offset: 40
	uint32 id = 5; // offset: 48
	uint32 DBIFEEDMAOF = 6; // offset: 44
	uint32 panel_id = 7; // offset: 36
	repeated uint32 taken_star_rewards = 11; // offset: 24
	uint32 FODLNKPNION = 14; // offset: 32
}

message ActiveActivityDataChangeScNotify {
	ActiveActivityData ANFFLNDCGLG = 5; // offset: 16
}

enum CmdActiveType {
	CmdActiveType_NLCDGIPGFDJ = 0;
	CmdActiveType_GetActiveActivityDataScRsp = 9566;
	CmdActiveType_TakeActiveActivityRewardScRsp = 9558;
	CmdActiveType_TakeActiveActivityRewardCsReq = 9567;
	CmdActiveType_ActiveActivityDataChangeScNotify = 9554;
	CmdActiveType_GetActiveActivityDataCsReq = 9560;
}

message GetActiveActivityDataCsReq {
}

message GetActiveActivityDataScRsp {
	repeated ActiveActivityData HCLGPDFBDNP = 9; // offset: 16
	uint32 retcode = 15; // offset: 32
}

message TakeActiveActivityRewardCsReq {
	uint32 id = 10; // offset: 24
}

message TakeActiveActivityRewardScRsp {
	uint32 retcode = 3; // offset: 40
	ItemList reward = 9; // offset: 16
	ActiveActivityData ANFFLNDCGLG = 11; // offset: 24
}
